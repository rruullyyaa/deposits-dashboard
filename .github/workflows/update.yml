name: Обновление данных из Bitrix24

on:
  schedule:
    - cron: '7 * * * *'   # каждый час в :07 (UTC)
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска
  push:
    branches: [main]

permissions:
  contents: write   # нужен только для ежемесячного keepalive-коммита
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install cryptography

      - name: Забрать данные из Bitrix24
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: python sync.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub отключает расписание, если в публичном репозитории 60 дней не было коммитов.
      # Раз в месяц (1-го числа, около 00:07 UTC) делаем пустой коммит, чтобы этого не случилось.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%Y-%m)"
            git push
          fi
